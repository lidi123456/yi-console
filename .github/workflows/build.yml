name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      only_daemons:
        description: Build only yi-agentd / yi-relay (no installers, saves CI minutes)
        type: boolean
        default: false
      windows_only:
        description: Build only the Windows installer (skip macOS, Linux desktop and Android; the installer then lacks the macOS yi-agentd)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Work out which platforms to build: for a Windows-only build, drop the macOS yi-agentd and every non-Windows desktop bundle
  # (matrix exclude can't remove entries added by include, so compute the list first and pass it to the matrix)
  plan:
    runs-on: ubuntu-latest
    outputs:
      daemons: ${{ steps.m.outputs.daemons }}
      desktop: ${{ steps.m.outputs.desktop }}
    steps:
      - id: m
        env:
          WINDOWS_ONLY: ${{ inputs.windows_only && 'true' || 'false' }}
        run: |
          daemons='[
            {"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","name":"linux-x86_64","cross":true},
            {"os":"ubuntu-latest","target":"aarch64-unknown-linux-musl","name":"linux-aarch64","cross":true},
            {"os":"macos-latest","target":"x86_64-apple-darwin","name":"macos-x86_64"},
            {"os":"macos-latest","target":"aarch64-apple-darwin","name":"macos-aarch64"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","name":"windows-x86_64","ext":".exe"}
          ]'
          desktop='[
            {"os":"ubuntu-22.04","target":"x86_64-unknown-linux-gnu","daemon":"linux-x86_64"},
            {"os":"macos-latest","target":"aarch64-apple-darwin","daemon":"macos-aarch64"},
            {"os":"macos-latest","target":"x86_64-apple-darwin","daemon":"macos-x86_64"},
            {"os":"windows-latest","target":"x86_64-pc-windows-msvc","daemon":"windows-x86_64","ext":".exe"}
          ]'
          if [ "$WINDOWS_ONLY" = true ]; then
            # Keep the Linux yi-agentd: the Windows build needs it to deploy to SSH hosts
            daemons=$(jq -c 'map(select(.os != "macos-latest"))' <<<"$daemons")
            desktop=$(jq -c 'map(select(.os == "windows-latest"))' <<<"$desktop")
          fi
          echo "daemons=$(jq -c . <<<"$daemons")" >> "$GITHUB_OUTPUT"
          echo "desktop=$(jq -c . <<<"$desktop")" >> "$GITHUB_OUTPUT"

  # yi-agentd for every platform (plus yi-relay on Linux). Desktop installers bundle all of them for automatic deployment to SSH hosts.
  daemons:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.daemons) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Commit hash and build time in the version: same value on every platform (the client checks both when it connects to yi-agentd, otherwise it keeps asking to upgrade)
      - name: build stamp
        shell: bash
        run: echo "YI_CONSOLE_BUILD_TIME=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Release version from the tag (v1.2.3 -> 1.2.3) written into Cargo.toml / tauri.conf.json; other builds keep the checked-in version
      - name: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v=$(node scripts/set-version.mjs "$GITHUB_REF_NAME"); else v=$(node -p "require('./app/src-tauri/tauri.conf.json').version"); fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build (cross)
        if: matrix.cross
        run: |
          cargo install cross --locked
          cross build --release --target ${{ matrix.target }} -p yi-agentd -p yi-relay
      - name: build
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }} -p yi-agentd
      - name: collect
        shell: bash
        run: |
          mkdir -p out
          cp target/${{ matrix.target }}/release/yi-agentd${{ matrix.ext }} out/yi-agentd-${{ matrix.name }}${{ matrix.ext }}
          if [ -f target/${{ matrix.target }}/release/yi-relay ]; then
            cp target/${{ matrix.target }}/release/yi-relay out/yi-relay-${{ matrix.name }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.name }}
          path: out/*

  desktop:
    needs: [plan, daemons]
    if: ${{ !inputs.only_daemons }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.desktop) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      # Commit hash and build time in the version: same value on every platform (the client checks both when it connects to yi-agentd, otherwise it keeps asking to upgrade)
      - name: build stamp
        shell: bash
        run: echo "YI_CONSOLE_BUILD_TIME=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Release version from the tag (v1.2.3 -> 1.2.3) written into Cargo.toml / tauri.conf.json; other builds keep the checked-in version
      - name: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v=$(node scripts/set-version.mjs "$GITHUB_REF_NAME"); else v=$(node -p "require('./app/src-tauri/tauri.conf.json').version"); fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: ${{ matrix.target }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/download-artifact@v4
        with:
          pattern: daemon-*
          merge-multiple: true
          path: daemons
      - name: place yi-agentd
        shell: bash
        run: |
          mkdir -p app/src-tauri/resources/yi-agentd app/src-tauri/binaries
          cp daemons/yi-agentd-* app/src-tauri/resources/yi-agentd/
          # The local sidecar reuses the build for the same platform
          cp daemons/yi-agentd-${{ matrix.daemon }}${{ matrix.ext }} app/src-tauri/binaries/yi-agentd-${{ matrix.target }}${{ matrix.ext }}
          chmod +x app/src-tauri/binaries/* app/src-tauri/resources/yi-agentd/* || true
      - run: npm ci
        working-directory: app
      # Updater bundles (NSIS setup / .app.tar.gz / AppImage plus .sig) need the updater signing key; releases must have it,
      # other builds without the secret just skip them
      - name: build
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":true}}'
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Releases need the TAURI_SIGNING_PRIVATE_KEY secret (updater signing key)"
            exit 1
          else
            npx tauri build --target ${{ matrix.target }}
          fi
      # Fixed names per platform (both macOS builds would otherwise produce the same "Yi Console.app.tar.gz");
      # scripts/release-manifest.mjs looks the updater bundles up by these names
      - name: collect
        shell: bash
        run: |
          shopt -s nullglob
          b=app/src-tauri/target/${{ matrix.target }}/release/bundle
          n="out/yi-console_${VERSION}_${{ matrix.daemon }}"
          mkdir -p out
          put() { cp "$1" "$2"; if [ -f "$1.sig" ]; then cp "$1.sig" "$2.sig"; fi; }
          for f in "$b"/nsis/*-setup.exe; do put "$f" "$n-setup.exe"; done
          for f in "$b"/msi/*.msi; do cp "$f" "$n.msi"; done
          for f in "$b"/dmg/*.dmg; do cp "$f" "$n.dmg"; done
          for f in "$b"/macos/*.app.tar.gz; do put "$f" "$n.app.tar.gz"; done
          for f in "$b"/appimage/*.AppImage; do put "$f" "$n.AppImage"; done
          for f in "$b"/deb/*.deb; do cp "$f" "$n.deb"; done
          for f in "$b"/rpm/*.rpm; do cp "$f" "$n.rpm"; done
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: out/*

  android:
    if: ${{ !inputs.only_daemons && !inputs.windows_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Commit hash and build time in the version: same value on every platform (the client checks both when it connects to yi-agentd, otherwise it keeps asking to upgrade)
      - name: build stamp
        shell: bash
        run: echo "YI_CONSOLE_BUILD_TIME=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      # Release version from the tag (v1.2.3 -> 1.2.3) written into Cargo.toml / tauri.conf.json; other builds keep the checked-in version
      - name: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v=$(node scripts/set-version.mjs "$GITHUB_REF_NAME"); else v=$(node -p "require('./app/src-tauri/tauri.conf.json').version"); fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          key: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # The runner ships with the Android SDK ($ANDROID_HOME); only the NDK needs installing
      - name: ndk
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - name: build apk
        working-directory: app
        run: |
          npx tauri android init --ci
          # Swap in our own MainActivity (makes room for the keyboard when the IME opens), see app/src-tauri/android/MainActivity.kt
          cp src-tauri/android/MainActivity.kt src-tauri/gen/android/app/src/main/java/dev/yiconsole/app/MainActivity.kt
          npx tauri android build --apk --target aarch64 --target armv7 --target x86_64
      - name: sign
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # No signing key configured: generate a throwaway one. It installs, but the signature changes every build, so uninstall the old version before upgrading.
          # Releases must use the fixed key: the in-app updater can only install an APK signed by the same key
          if [ -z "$KEYSTORE_B64" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "::error::Releases need the ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD secrets"
            exit 1
          fi
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.jks
            pass="$KEYSTORE_PASSWORD"
          else
            pass=ephemeral
            keytool -genkeypair -keystore release.jks -storepass $pass -keypass $pass -alias app \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Yi Console"
          fi
          apk=$(find app/src-tauri/gen/android -name '*-release-unsigned.apk' | head -1)
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f 4 "$apk" aligned.apk
          mkdir -p out
          "$bt/apksigner" sign --ks release.jks --ks-pass pass:$pass --ks-key-alias app --out "out/yi-console_${VERSION}_android.apk" aligned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: out/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [daemons, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      # Release notes = the tag message (checkout turns an annotated tag into a lightweight one, so fetch it again)
      - name: notes
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # latest.json (desktop updater) and latest-android.json (Android updater); the app reads them from releases/latest/download/
      - name: manifests
        run: node scripts/release-manifest.mjs dist "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
