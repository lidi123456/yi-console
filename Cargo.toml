[workspace]
resolver = "2"
members = ["crates/proto", "crates/link", "crates/yi-agentd", "crates/relay", "crates/client", "crates/web"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "6"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 4
