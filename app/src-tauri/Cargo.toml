[package]
name = "yi-console"
version = "0.1.0"
edition = "2021"
description = "Yi Console 桌面 / Android 客户端"
license = "MIT"

[lib]
name = "yi_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs 往 Android 清单里加相机权限（和 tauri-build 用同一个 feature，不多拉依赖）
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = [] }
# 2.8 起桌面端点击通知才会回报给 onAction
tauri-plugin-notification = "2.8"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
base64 = "0.22"
yi-client = { path = "../../crates/client" }

# 另存为用系统的保存对话框
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
# 记住窗口大小和位置
tauri-plugin-window-state = "2"

# 粘贴本机文件时读剪贴板里的文件路径（CF_HDROP），见 src/clipfiles.rs
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# 手机上用系统浏览器打开链接（桌面端走 ClientHub 的 url.open）
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 4
