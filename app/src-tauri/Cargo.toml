[package]
name = "yi-console"
version = "0.1.0"
edition = "2021"
description = "Yi Console desktop / Android client"
license = "MIT"

[lib]
name = "yi_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# build.rs adds the camera permission to the Android manifest (same feature as tauri-build, no extra dependencies)
tauri-utils = { version = "2", features = ["build-2"] }

[dependencies]
tauri = { version = "2", features = [] }
# Since 2.8, clicking a notification on desktop is reported to onAction
tauri-plugin-notification = "2.8"
tauri-plugin-clipboard-manager = "2"
serde_json = "1"
base64 = "0.22"
yi-client = { path = "../../crates/client" }

# "Save as" uses the system save dialog
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-dialog = "2"
# Remember window size and position
tauri-plugin-window-state = "2"
# Self-update from GitHub Releases (latest.json), see src/updater.rs; Android has its own in MainActivity.kt
tauri-plugin-updater = "2"

# Read file paths from the clipboard (CF_HDROP) when pasting local files, see src/clipfiles.rs
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Open links in the system browser on mobile (desktop goes through ClientHub's url.open)
tauri-plugin-opener = "2"

[profile.release]
opt-level = "s"
lto = "thin"
strip = true
codegen-units = 4
