# Yi Console connectors: the SDK, the first-party connectors and the packer. A workspace of its own: connectors build for
# wasm32-wasip2 (`cargo build --release --target wasm32-wasip2`), the packer for the host. See docs/connectors.en.md.
[workspace]
resolver = "2"
members = ["sdk", "github", "feishu", "testkit", "pack"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
yi-connector = { path = "sdk" }
wit-bindgen = { version = "0.63", default-features = false, features = ["macros", "realloc", "std", "bitflags"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
