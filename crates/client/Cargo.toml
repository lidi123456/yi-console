[package]
name = "yi-client"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yi Console client core: host management, SSH/relay connections, automatic yi-agentd deployment, reconnects"

[dependencies]
yi-proto = { path = "../proto" }
yi-link = { path = "../link" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
uuid.workspace = true
base64.workspace = true
dirs.workspace = true
gethostname = "1"
# ring cross-compiles more easily than aws-lc-rs (no cmake needed for Android)
russh = { version = "0.55", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"

[dev-dependencies]
tempfile = "3"
