[package]
name = "yi-link"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yi Console relay link: identity keys, pairing / access links, relay auth, Noise end-to-end encrypted WebSocket channel"

[dependencies]
anyhow.workspace = true
tokio.workspace = true
base64.workspace = true
serde_json.workspace = true
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# End to end: Noise IK / IKpsk2 (X25519 + ChaCha20-Poly1305 + SHA-256)
snow = "0.10"
# Relay-layer identity: Ed25519 challenge signatures
ed25519-dalek = "2"
# Derive the public key from an X25519 private key
curve25519-dalek = "4"
hkdf = "0.12"
sha2 = "0.10"
subtle = "2"
getrandom = "0.3"
# Relay self-signed certificates are verified by fingerprint
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tokio = { workspace = true }
