[package]
name = "yi-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yi Console relay server: lets phones reach yi-agentd on a computer behind NAT (forwards ciphertext only)"

[dependencies]
yi-link = { path = "../link" }
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio-tungstenite = "0.28"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pemfile = "2"
# Generate a self-signed certificate when there's no domain; clients pin it by fingerprint
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
