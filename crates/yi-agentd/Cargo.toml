[package]
name = "yi-agentd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Yi Console daemon: hosts AI coding tool sessions"

[dependencies]
yi-proto = { path = "../proto" }
yi-link = { path = "../link" }
yi-client = { path = "../client" }
qrcode = { version = "0.14", default-features = false }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
uuid.workspace = true
base64.workspace = true
dirs.workspace = true
rusqlite = { version = "0.37", features = ["bundled"] }
portable-pty = "0.9"
ureq = "3"
gethostname = "1"
md5 = "0.7"
regex = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Named pipe access rights (granted by user SID, so elevated and normal processes can talk to each other)
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
